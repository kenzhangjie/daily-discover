podcast:
  # 中英文播客混在这一张名单上,页面上也是同一个「播客」渠道。
  # 两种写法,run.fetch_podcast 按有没有 feed 分流:
  #   无 feed → 小宇宙。id = 播客页 URL xiaoyuzhoufm.com/podcast/<id> 里那串。
  #             小宇宙没有公开 RSS,适配器直接读页面里的 __NEXT_DATA__。
  #   有 feed → 通用 RSS。id 随便取(做去重用),feed 才是真正要抓的地址。
  #
  # 播客是周更级的,所以 run.py 给 podcast/rss/blog 的是 **7 天**窗口而不是 36 小时 ——
  # 否则一周里有六天这个渠道整个是空的(2026-09-15 实测两个小宇宙最新一集是
  # 12 天和 17 天前)。帖子仍按自己的发布时间排序分档,不会假装是今天发的。
  #
  # 加新的:python3 tools/podfind.py "<名字>" —— 它打印的最后两行就是这里的格式,
  # 并且会告诉你最新一集是什么时候(节目挂在目录里但 feed 早就不更了,是常态)。
