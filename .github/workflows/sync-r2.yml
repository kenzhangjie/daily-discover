name: sync github radar to R2

# 云沙盒的代理对 github.com 网页、codeload、api.github.com 的普通 HTTP GET
# 一律 403(2026-09-15 实测),而榜单块的「GitHub 新星 / 新版本」只能从那几个
# 地方拿。Actions runner 跑在 GitHub 自己的机器上没有这个限制,所以由它算好
# 摆到 R2,routine 去读 R2。
#
# 2026-09-15 仓库转公开后,**源码同步那一半已经删掉**:raw.githubusercontent.com
# 不带 token 直接 200,routine 从 GitHub 直接拉。所以这个 workflow 不再需要
# 监听 push —— 它现在只跟「今天的 release / trending 是什么」有关,与代码无关。

on:
  # routine 在 01:00 UTC 跑,提前 20 分钟刷一遍,否则页面停在上次跑的那天。
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 算 GitHub 榜单并写入 R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 sync_to_r2.py
      - name: 验证公网可读
        run: |
          R2="https://pub-42a2b5c1ec984024833f48ca358f4571.r2.dev"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$R2/radar/github.json")
          echo "radar/github.json -> HTTP $code"
          [ "$code" = "200" ] || exit 1
